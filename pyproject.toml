[project]
name = "freecad"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["click>=8.1"]

[project.scripts]
freecad-tools = "freecad_tools.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freecad_tools"]
